name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      AILINUX_HELPER_SOURCE: ${{ github.workspace }}/ailinux-helper
      AILINUX_HELPER_RELEASE_MANIFEST: ${{ github.workspace }}/ailinux-helper/release.json
      TRIFORCE_STATE_DIR: ${{ runner.temp }}/triforce-state
      TRIFORCE_LOG_DIR: ${{ runner.temp }}/triforce-logs
    steps:
      - uses: actions/checkout@v7
      - name: Checkout pinned AILinux Helper WebMCP source
        uses: actions/checkout@v7
        with:
          repository: derleiti/ailinux-helper
          ref: a030114de94aa2f987cb6ef36e1bfe73c9ebf92a
          path: ailinux-helper
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
          cache: pip
      - name: Install project and check dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Compile Python sources
        run: python -m compileall -q app tests
      - name: Critical Ruff checks
        run: ruff check app tests --select E9,F63,F7,F82
      - name: Contract and security tests
        run: |
          python -m pytest -q tests/test_aicoder_mcp_contract.py tests/test_security_findings.py

      # The workspace/MCP suite carries the pairing, capability and credential
      # regressions. It used to run only on developer machines, so CI stayed
      # green while these paths were unverified. Failures here are real.
      - name: Workspace, MCP and credential regressions
        run: |
          python -m pytest -q \
            tests/test_mcp_workspace_capability.py \
            tests/test_mcp_public_workspace_surface.py \
            tests/test_mcp_workspace_schema_contract.py \
            tests/test_local_workspace_client.py \
            tests/test_log_formatters.py \
            tests/test_server_launcher.py \
            tests/test_workspace_compute_sandbox.py \
            tests/test_android_workspace_contract.py
