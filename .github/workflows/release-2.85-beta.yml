name: TriForce 2.85 Pre-release

on:
  workflow_dispatch:
    inputs:
      publish:
        description: 'Create/update the GitHub pre-release after every build passes'
        required: true
        type: boolean
        default: false
      tag:
        description: 'Release tag'
        required: true
        type: string
        default: 'v2.85.0-beta2'
      windows_version:
        description: 'AIWindows artifact version'
        required: true
        type: string
        default: '1.0.0-beta2'
  push:
    tags:
      - 'v2.85.0-beta*'
    branches:
      - 'release-ci'

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
          cache: pip
      - name: Install locked runtime
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-lock-2.85-beta2.txt
          pip check
      - name: Full test suite
        env:
          PYTHONPATH: .
        run: python -m pytest -q
      - name: Packaging contracts
        run: git diff --check

  linux:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
          cache: pip
      - name: Install native build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y patchelf gcc g++
      - name: Build locked backend runtime and compiled Control Center
        env:
          PYTHON_BIN: python3.14
          BACKEND_RUNTIME: ${{ runner.temp }}/triforce-2.85-backend-runtime
          GUI_VENV: ${{ runner.temp }}/triforce-2.85-gui-build-venv
          GUI_OUT: ${{ runner.temp }}/triforce-2.85-nuitka
        run: scripts/release/prepare-triforce-2.85-ci-build.sh
      - name: Build Debian packages
        env:
          BACKEND_RUNTIME: ${{ runner.temp }}/triforce-2.85-backend-runtime
          GUI_BUNDLE: ${{ runner.temp }}/triforce-2.85-nuitka/main.dist
          OUT_DIR: ${{ runner.temp }}/release-linux
        run: scripts/release/build-triforce-2.85-beta2.sh
      - name: Verify Debian artifacts
        run: |
          set -eu
          cd '${{ runner.temp }}/release-linux'
          sha256sum -c SHA256SUMS
          dpkg-deb --info triforce-backend_2.85.0~beta2_amd64.deb >/dev/null
          dpkg-deb --info triforce-control-center_2.85.0~beta2_amd64.deb >/dev/null
          tmp=$(mktemp -d)
          dpkg-deb -x triforce-backend_2.85.0~beta2_amd64.deb "$tmp"
          test "$(readlink "$tmp/opt/triforce/runtime/bin/python3.14")" = '/usr/bin/python3.14'
          grep -q 'google-genai==2.18.1' "$tmp/opt/triforce/requirements-lock-2.85-beta2.txt"
          ! grep -q '^google-generativeai' "$tmp/opt/triforce/requirements-lock-2.85-beta2.txt"
          rm -rf "$tmp"
          echo DEBIAN_RELEASE_SMOKE_OK
      - uses: actions/upload-artifact@v7
        with:
          name: triforce-linux-2.85-beta2
          if-no-files-found: error
          path: ${{ runner.temp }}/release-linux/*

  arch:
    needs: linux
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - name: Install build tools
        run: pacman -Syu --noconfirm base-devel python systemd zlib expat libarchive git sudo
      - name: Require Python 3.14 ABI
        run: python -c "import sys; assert sys.version_info[:2] == (3,14), sys.version"
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v7
        with:
          name: triforce-linux-2.85-beta2
          path: /tmp/linux-artifacts
      - name: Render release and local PKGBUILDs
        run: |
          set -eu
          mkdir -p /tmp/arch-build
          cp /tmp/linux-artifacts/triforce-backend_2.85.0~beta2_amd64.deb /tmp/arch-build/
          TAG='${{ inputs.tag }}'
          if [ -z "$TAG" ]; then TAG='${GITHUB_REF_NAME}'; fi
          RELEASE_URL="https://github.com/derleiti/triforce-dev-mcp/releases/download/${TAG}/triforce-backend_2.85.0~beta2_amd64.deb"
          scripts/release/render-arch-pkgbuild.sh /tmp/arch-build/triforce-backend_2.85.0~beta2_amd64.deb /tmp/arch-release "$RELEASE_URL"
          cp /tmp/arch-release/PKGBUILD /tmp/arch-build/PKGBUILD.release
          cp packaging/arch/triforce.install /tmp/arch-build/
          SHA=$(sha256sum /tmp/arch-build/triforce-backend_2.85.0~beta2_amd64.deb | awk '{print $1}')
          sed -e 's#source=(.*#source=("triforce-backend_2.85.0~beta2_amd64.deb")#' \
              -e "s#sha256sums=.*#sha256sums=('${SHA}')#" \
              packaging/arch/PKGBUILD.in > /tmp/arch-build/PKGBUILD
      - name: Build Arch package with makepkg
        run: |
          useradd -m builder
          chown -R builder:builder /tmp/arch-build
          cd /tmp/arch-build
          sudo -u builder makepkg --noconfirm --cleanbuild
          ls -lh *.pkg.tar.zst
      - name: Install and import-smoke Arch package
        run: |
          cd /tmp/arch-build
          pacman -U --noconfirm ./*.pkg.tar.zst
          test -f /usr/lib/systemd/system/triforce.service
          test "$(readlink /opt/triforce/runtime/bin/python3.14)" = '/usr/bin/python'
          PYTHONPATH=/opt/triforce /opt/triforce/runtime/bin/python - <<'PY'
          from app.config import VERSION
          from google import genai
          print('ARCH_PACKAGE_SMOKE_OK', VERSION, getattr(genai, '__version__', 'unknown'))
          PY
      - name: Collect Arch release artifacts
        run: |
          mkdir -p /tmp/arch-artifacts
          cp /tmp/arch-build/*.pkg.tar.zst /tmp/arch-artifacts/
          cp /tmp/arch-build/PKGBUILD.release /tmp/arch-artifacts/PKGBUILD
          cp packaging/arch/triforce.install /tmp/arch-artifacts/
          (cd /tmp/arch-artifacts && sha256sum *.pkg.tar.zst > SHA256SUMS-arch.txt)
      - uses: actions/upload-artifact@v7
        with:
          name: triforce-arch-2.85-beta2
          if-no-files-found: error
          path: /tmp/arch-artifacts/*

  windows:
    needs: test
    runs-on: windows-latest
    steps:
      - name: Checkout pinned AIWindows client
        uses: actions/checkout@v7
        with:
          repository: derleiti/aiwindows-client
          ref: 1f7c4e7520fffcdbcfa18d72d45dcd262f9a90e2
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pyinstaller
      - name: Validate Windows package imports
        shell: pwsh
        run: |
          python -m compileall -q aiwindows_client
          python -c "from aiwindows_client.core.hardware_detect import hardware_detector; from aiwindows_client.core.local_mcp import LocalMCPExecutor; from aiwindows_client.core.cli_agents import agent_detector; from aiwindows_client.core.planning_prompt import DEFAULT_SYSTEM_PROMPT; from aiwindows_client.core.mcp_stdio_server import MCPStdioServer; print('WINDOWS_IMPORT_SMOKE_OK')"
      - name: Resolve artifact version
        id: version
        shell: bash
        run: |
          VERSION='${{ inputs.windows_version }}'
          if [ -z "$VERSION" ]; then VERSION='1.0.0-beta2'; fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - name: Build portable EXE
        shell: pwsh
        run: |
          python -c "from PIL import Image; img=Image.open('icon.jpg'); img.save('icon.ico', format='ICO', sizes=[(256,256),(128,128),(64,64),(48,48),(32,32),(16,16)])"
          pyinstaller `
            --name="AIWindows-Client" `
            --onefile `
            --windowed `
            --icon="icon.ico" `
            --add-data="aiwindows_client/ui;aiwindows_client/ui" `
            --add-data="aiwindows_client/core;aiwindows_client/core" `
            --add-data="aiwindows_client/translations;aiwindows_client/translations" `
            --add-data="aiwindows_client/assets;aiwindows_client/assets" `
            --add-data="icon.jpg;." `
            --hidden-import=PyQt6.QtWebEngineWidgets `
            --hidden-import=PyQt6.QtWebEngineCore `
            --hidden-import=httpx `
            --hidden-import=aiohttp `
            --hidden-import=websockets `
            --hidden-import=cryptography `
            --hidden-import=PIL `
            --hidden-import=winpty `
            --hidden-import=pyte `
            --clean --noconfirm run_aiwindows.py
          $version = '${{ steps.version.outputs.version }}'
          Move-Item dist/AIWindows-Client.exe "dist/AIWindows-Client-$version.exe"
      - name: Smoke-test portable EXE
        shell: pwsh
        run: |
          $version = '${{ steps.version.outputs.version }}'
          $exe = Resolve-Path "dist/AIWindows-Client-$version.exe"
          $p = Start-Process -FilePath $exe -ArgumentList '--hwinfo' -PassThru -Wait
          if ($p.ExitCode -ne 0) { throw "portable EXE smoke failed with exit code $($p.ExitCode)" }
          $bytes = [System.IO.File]::ReadAllBytes($exe)
          if ($bytes[0] -ne 0x4D -or $bytes[1] -ne 0x5A) { throw 'EXE has no MZ header' }
          Write-Host 'WINDOWS_EXE_SMOKE_OK'
      - name: Build Inno Setup installer
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          $version = '${{ steps.version.outputs.version }}'
          $iscc = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          if (!(Test-Path $iscc)) { throw "ISCC not found: $iscc" }
          & $iscc "/DMyAppVersion=$version" "/DMyAppExe=AIWindows-Client-$version.exe" installer/AIWindows-Client.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $setup = Resolve-Path "dist/AIWindows-Client-Setup-$version.exe"
          $bytes = [System.IO.File]::ReadAllBytes($setup)
          if ($bytes[0] -ne 0x4D -or $bytes[1] -ne 0x5A) { throw 'Setup has no MZ header' }
          Write-Host 'WINDOWS_SETUP_SMOKE_OK'
      - name: Generate Windows checksums
        shell: bash
        run: |
          cd dist
          sha256sum AIWindows-Client-${{ steps.version.outputs.version }}.exe AIWindows-Client-Setup-${{ steps.version.outputs.version }}.exe > SHA256SUMS-windows.txt
      - uses: actions/upload-artifact@v7
        with:
          name: aiwindows-1.0.0-beta2
          if-no-files-found: error
          path: |
            dist/AIWindows-Client-${{ steps.version.outputs.version }}.exe
            dist/AIWindows-Client-Setup-${{ steps.version.outputs.version }}.exe
            dist/SHA256SUMS-windows.txt

  release:
    needs: [test, linux, arch, windows]
    if: ${{ startsWith(github.ref, 'refs/tags/') || inputs.publish == true }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v7
        with:
          path: release-assets
          merge-multiple: true
      - name: Generate combined checksum manifest
        run: |
          cd release-assets
          find . -maxdepth 1 -type f \( -name '*.deb' -o -name '*.zst' -o -name '*.exe' -o -name 'PKGBUILD' -o -name 'triforce.install' \) -print0 \
            | sort -z | xargs -0 sha256sum > SHA256SUMS
          cat SHA256SUMS
      - name: Build release notes
        run: |
          cat > release-notes.md <<'EOF'
          ## TriForce 2.85 Beta 2

          Pre-release for real-world installation and upgrade testing.

          ### Artifacts
          - Debian/Ubuntu: `triforce-backend` and compiled PyQt6 `triforce-control-center`
          - Arch Linux: tested `triforce-bin` package plus `PKGBUILD`
          - Windows: portable AIWindows Client executable and Inno Setup installer

          ### Important
          - This is a beta/pre-release. Back up production configuration before package migration.
          - The backend service is not automatically enabled or started by the package.
          - API credentials are never shipped in release artifacts.
          EOF
      - name: Create or update GitHub pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG='${{ inputs.tag }}'
          if [ -z "$TAG" ]; then TAG="$GITHUB_REF_NAME"; fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" release-assets/* --clobber
            gh release edit "$TAG" --prerelease --title 'TriForce 2.85 Beta 2' --notes-file release-notes.md
          else
            gh release create "$TAG" release-assets/* --prerelease --title 'TriForce 2.85 Beta 2' --notes-file release-notes.md --target "$GITHUB_SHA"
          fi
