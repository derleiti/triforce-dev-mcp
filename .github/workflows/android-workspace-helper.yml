name: Android Workspace Helper
on:
  workflow_dispatch:
  push:
    paths:
      - 'android_workspace/**'
      - '.github/workflows/android-workspace-helper.yml'
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Test and build APK
        working-directory: android_workspace
        run: gradle --no-daemon :app:testDebugUnitTest :app:assembleDebug
      - name: Prepare artifact
        run: |
          mkdir -p releases/android
          cp android_workspace/app/build/outputs/apk/debug/app-debug.apk releases/android/AILinux-Workspace-latest.apk
          sha256sum releases/android/AILinux-Workspace-latest.apk > releases/android/AILinux-Workspace-latest.apk.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: AILinux-Workspace-Android
          path: |
            releases/android/AILinux-Workspace-latest.apk
            releases/android/AILinux-Workspace-latest.apk.sha256
