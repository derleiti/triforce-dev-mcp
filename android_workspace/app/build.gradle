plugins { id 'com.android.application' }

def releaseKeystore = System.getenv('AILINUX_ANDROID_KEYSTORE')
def releaseStorePassword = System.getenv('AILINUX_ANDROID_STORE_PASSWORD')
def releaseKeyAlias = System.getenv('AILINUX_ANDROID_KEY_ALIAS') ?: 'ailinux-workspace'
def releaseKeyPassword = System.getenv('AILINUX_ANDROID_KEY_PASSWORD')
def hasReleaseSigning = releaseKeystore && releaseStorePassword && releaseKeyPassword

android {
    namespace 'me.ailinux.workspace'
    compileSdk 35

    signingConfigs {
        if (hasReleaseSigning) {
            release {
                storeFile file(releaseKeystore)
                storePassword releaseStorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
                enableV1Signing true
                enableV2Signing true
                enableV3Signing true
                enableV4Signing true
            }
        }
    }

    defaultConfig {
        applicationId 'me.ailinux.workspace'
        minSdk 26
        targetSdk 35
        versionCode 2
        versionName '2.86.7'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }
    buildTypes {
        release {
            minifyEnabled false
            if (hasReleaseSigning) signingConfig signingConfigs.release
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.core:core:1.15.0'
    implementation 'androidx.documentfile:documentfile:1.0.1'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    testImplementation 'junit:junit:4.13.2'
}
