<VirtualHost *:80>
 ServerName discord.ailinux.me
 Redirect permanent / https://discord.ailinux.me/
</VirtualHost>
<VirtualHost *:443>
 ServerName discord.ailinux.me
 SSLEngine on
 SSLCertificateFile /etc/letsencrypt/live/ailinux.me/fullchain.pem
 SSLCertificateKeyFile /etc/letsencrypt/live/ailinux.me/privkey.pem
 DocumentRoot /var/www/api-root/discord-rc1
 DirectoryIndex index.html
 <Directory /var/www/api-root/discord-rc1>
  Require all granted
  Options -Indexes
 </Directory>
 Header always set X-Content-Type-Options "nosniff"
 Header always set Content-Security-Policy "default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'"
 RequestHeader unset X-TriForce-Internal
 RequestHeader unset X-TriForce-Internal-Token
 RequestHeader unset X-Forwarded-For
 RequestHeader set X-Forwarded-Port "9100"
 RequestHeader set X-Internal-Auth "%{PROXY_AUTH_TOKEN}e"
 ProxyPreserveHost On
 ProxyPass /.well-known/oauth-protected-resource/mcp http://host.docker.internal:9000/v1/discord-mcp/oauth2/.well-known/oauth-protected-resource/mcp
 ProxyPassReverse /.well-known/oauth-protected-resource/mcp http://host.docker.internal:9000/v1/discord-mcp/oauth2/.well-known/oauth-protected-resource/mcp
 ProxyPass /.well-known/oauth-protected-resource http://host.docker.internal:9000/v1/discord-mcp/oauth2/.well-known/oauth-protected-resource
 ProxyPassReverse /.well-known/oauth-protected-resource http://host.docker.internal:9000/v1/discord-mcp/oauth2/.well-known/oauth-protected-resource
 ProxyPass /.well-known/oauth-authorization-server http://host.docker.internal:9000/v1/discord-mcp/oauth2/.well-known/oauth-authorization-server
 ProxyPassReverse /.well-known/oauth-authorization-server http://host.docker.internal:9000/v1/discord-mcp/oauth2/.well-known/oauth-authorization-server
 ProxyPass /authorize/approve http://host.docker.internal:9000/v1/discord-mcp/oauth2/authorize/approve
 ProxyPassReverse /authorize/approve http://host.docker.internal:9000/v1/discord-mcp/oauth2/authorize/approve
 ProxyPass /authorize http://host.docker.internal:9000/v1/discord-mcp/oauth2/authorize
 ProxyPassReverse /authorize http://host.docker.internal:9000/v1/discord-mcp/oauth2/authorize
 ProxyPass /register http://host.docker.internal:9000/v1/discord-mcp/oauth2/register
 ProxyPassReverse /register http://host.docker.internal:9000/v1/discord-mcp/oauth2/register
 ProxyPass /token http://host.docker.internal:9000/v1/discord-mcp/oauth2/token
 ProxyPassReverse /token http://host.docker.internal:9000/v1/discord-mcp/oauth2/token
 ProxyPass /mcp http://host.docker.internal:9000/v1/discord-mcp/mcp
 ProxyPassReverse /mcp http://host.docker.internal:9000/v1/discord-mcp/mcp
 ProxyPass /v1/discord-mcp http://host.docker.internal:9000/v1/discord-mcp
 ProxyPassReverse /v1/discord-mcp http://host.docker.internal:9000/v1/discord-mcp
 ProxyPass /api/discord/oauth/callback http://host.docker.internal:9000/v1/discord-mcp/oauth/callback
 ProxyPassReverse /api/discord/oauth/callback http://host.docker.internal:9000/v1/discord-mcp/oauth/callback
</VirtualHost>
