<VirtualHost *:80>
 ServerName discord.ailinux.me
 Redirect permanent / https://discord.ailinux.me/
</VirtualHost>
<VirtualHost *:443>
 ServerName discord.ailinux.me
 SSLEngine on
 SSLCertificateFile /etc/letsencrypt/live/ailinux.me/fullchain.pem
 SSLCertificateKeyFile /etc/letsencrypt/live/ailinux.me/privkey.pem
 DocumentRoot /var/www/api-root/discord-rc1
 <Directory /var/www/api-root/discord-rc1>
   Require all granted
   Options -Indexes
 </Directory>
 Header always set X-Content-Type-Options "nosniff"
 Header always set Referrer-Policy "same-origin"
 Header always set X-Frame-Options "DENY"
 # Global Apache CSP uses form-action self. OAuth consent forms redirect to
 # the single registered client callback. Drop ONLY that inherited directive
 # on the authorize endpoint; the backend supplies its own strict CSP with
 # the exact, verified callback origin and one-time script nonce.
 <LocationMatch "^/(authorize|v1/discord-mcp/oauth2/authorize)$">
   Header always edit* Content-Security-Policy "form-action 'self';" ""
 </LocationMatch>
 RequestHeader unset X-TriForce-Internal
 RequestHeader unset X-TriForce-Internal-Token
 RequestHeader unset X-Forwarded-For
 RequestHeader set X-Forwarded-Proto "https"
 ProxyPreserveHost On
 ProxyPass / http://172.18.0.1:9184/ retry=0
 ProxyPassReverse / http://172.18.0.1:9184/
 LogFormat "%h %t \"%m %U %H\" %>s %b" discord_safe
 CustomLog /proc/self/fd/1 discord_safe
 ErrorLog /proc/self/fd/2
</VirtualHost>
