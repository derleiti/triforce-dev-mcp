# ============================================================
# Sperrt sensible Dateien im Webroot.
# Anlass 2026-07-13: config/triforce.env war oeffentlich mit
# HTTP 200 abrufbar (578 Zeilen, 34 mit KEY=/SECRET=/TOKEN=).
# *.php.bak.* wurden als Klartext ausgeliefert.
# AllowOverride ist auskommentiert -> .htaccess greift nicht.
# ============================================================

<FilesMatch "^\.(?!well-known(?:$|/))">
    Require all denied
</FilesMatch>

<FilesMatch "\.(env|bak|backup|old|orig|save|swp|swo|tmp|sql|dist|log|inc)$">
    Require all denied
</FilesMatch>

<FilesMatch "\.(bak|old|orig|save)[._-]">
    Require all denied
</FilesMatch>

<FilesMatch "\.(pre_|REMOVED|disabled|copy)">
    Require all denied
</FilesMatch>

<LocationMatch "^/\.well-known/acme-challenge/">
    Require all granted
</LocationMatch>
