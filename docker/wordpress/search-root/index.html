<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AILinux Search</title><meta name="description" content="Präzise KI-Suche für Websites, Videos, Dateien, Downloads und Bilder – ohne SEO-Ballast."><link rel="search" type="application/opensearchdescription+xml" title="AILinux Search" href="/opensearch.xml"><style>
:root{color-scheme:dark;--bg:#090b10;--panel:#111620;--line:#263142;--text:#eef3fa;--muted:#96a2b4;--accent:#7dd3fc;--good:#86efac}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% 0,#172033 0,#090b10 46%);color:var(--text);font:16px/1.5 system-ui,sans-serif;min-height:100vh}.wrap{width:min(980px,calc(100% - 28px));margin:auto;padding:12vh 0 60px}header{text-align:center;margin-bottom:28px}.brand{font-size:clamp(2rem,7vw,4.4rem);font-weight:800;letter-spacing:-.06em}.brand span{color:var(--accent)}header p{color:var(--muted);margin:.4rem 0}.searchbox{display:flex;gap:10px;background:var(--panel);border:1px solid var(--line);padding:10px;border-radius:22px;box-shadow:0 22px 70px #0008}input{flex:1;border:0;outline:0;background:transparent;color:var(--text);font-size:1.08rem;padding:12px 14px;min-width:0}button{border:0;border-radius:14px;padding:12px 18px;background:var(--accent);color:#07111c;font-weight:750;cursor:pointer}.tabs{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin:16px 0 26px}.tab{background:#121824;color:var(--muted);border:1px solid var(--line);padding:8px 13px}.tab.active{color:var(--text);border-color:var(--accent);background:#162334}.meta{color:var(--muted);font-size:.9rem;margin:12px 2px}.answer,.result{background:color-mix(in srgb,var(--panel) 92%,transparent);border:1px solid var(--line);border-radius:16px;padding:16px;margin:12px 0}.answer{border-color:#31506a}.answer strong{color:var(--good)}.result a{color:var(--text);font-size:1.08rem;font-weight:700;text-decoration:none}.result a:hover{color:var(--accent)}.url{color:var(--good);font-size:.82rem;overflow-wrap:anywhere}.snippet{color:#c7d0dc;margin-top:6px}.images{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px}.image{background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden}.image img{width:100%;height:170px;object-fit:cover;display:block}.image div{padding:10px;font-size:.9rem}.empty{text-align:center;color:var(--muted);padding:35px}.spinner{display:inline-block;width:16px;height:16px;border:2px solid #ffffff40;border-top-color:var(--accent);border-radius:50%;animation:s .7s linear infinite}@keyframes s{to{transform:rotate(360deg)}}@media(max-width:600px){.wrap{padding-top:7vh}.searchbox{display:grid}.searchbox button{width:100%}}
</style></head><body><main class="wrap"><header><div class="brand">AI<span>Linux</span> Search</div><p>Keywords oder Prompt eingeben. TriForce erkennt die Suchart automatisch.</p><p>Präzise Quellen statt SEO-Seiten.</p></header><form id="form" class="searchbox"><input id="q" autocomplete="off" autofocus placeholder="z. B. AILinux ISO Download oder: Wie funktioniert WireGuard?" maxlength="400"><button>Suchen</button></form><nav class="tabs" id="tabs"></nav><div class="meta" id="meta"></div><section id="out"></section></main><script>
const modes=[['auto','Automatisch'],['web','Websites'],['news','News'],['docs','Doku'],['code','Code'],['science','Science'],['videos','Videos'],['files','Dateien'],['downloads','Downloads'],['images','Bilder']];let mode='auto';const tabs=document.querySelector('#tabs'),out=document.querySelector('#out'),meta=document.querySelector('#meta'),q=document.querySelector('#q');
function esc(s=''){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function drawTabs(){tabs.innerHTML=modes.map(([v,l])=>`<button type="button" class="tab ${mode===v?'active':''}" data-mode="${v}">${l}</button>`).join('')}drawTabs();tabs.onclick=e=>{const b=e.target.closest('[data-mode]');if(!b)return;mode=b.dataset.mode;drawTabs();if(q.value.trim())search()};
function card(r){const url=r.url||r.source_url||'';return `<article class="result"><a href="${esc(url)}" target="_blank" rel="noopener">${esc(r.title||url||'Ergebnis')}</a><div class="url">${esc(url)}</div><div class="snippet">${esc(r.snippet||r.content||'')}</div></article>`}
async function search(){const query=q.value.trim();if(!query)return;history.replaceState(null,'',`?q=${encodeURIComponent(query)}&mode=${mode}`);meta.innerHTML='<span class="spinner"></span> TriForce sucht und filtert …';out.innerHTML='';try{const res=await fetch('https://api.ailinux.me/v1/search/curated',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({query,mode,max_results:40,lang:'de',synthesize:true})});if(!res.ok){let detail='';try{const e=await res.json();detail=e.detail||e.error||''}catch{}throw new Error(`HTTP ${res.status}${detail?': '+detail:''}`)}const d=await res.json();meta.textContent=`${d.results.length} Treffer · Modus: ${d.mode} · ${d.stats?.domains_unique||0} Quellen · ${d.stats?.total_ms||0} ms`;if(d.answer)out.innerHTML=`<div class="answer"><strong>TriForce Antwort</strong><div>${esc(d.answer)}</div></div>`;if(d.mode==='images'){out.innerHTML+=`<div class="images">${d.results.map(r=>`<a class="image" href="${esc(r.source_url||r.url||'')}" target="_blank" rel="noopener"><img loading="lazy" src="${esc(r.image_url||r.thumbnail||r.url||'')}" alt=""><div>${esc(r.title||'Bild')}</div></a>`).join('')}</div>`}else out.innerHTML+=d.results.map(card).join('');if(!d.results.length)out.innerHTML+='<div class="empty">Keine belastbaren Treffer gefunden.</div>'}catch(e){meta.textContent='Suche fehlgeschlagen';out.innerHTML=`<div class="empty">${esc(e.message)}</div>`}}
document.querySelector('#form').onsubmit=e=>{e.preventDefault();search()};const p=new URLSearchParams(location.search);if(p.get('q')){q.value=p.get('q');mode=p.get('mode')||'auto';drawTabs();search()}
</script></body></html>
