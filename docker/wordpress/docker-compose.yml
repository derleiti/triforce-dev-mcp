
x-logging: &default_logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "3"

x-gateway-hosts: &gateway_hosts
  - "docker.gateway:host-gateway"
  - "docker.host.internal:host-gateway"
  - "host.docker.internal:host-gateway"
  - "api.ailinux.me:host-gateway"

services:
  apache:
    image: ${WP_APACHE_IMAGE:-httpd:2.4-alpine}
    container_name: ${WP_APACHE_CONTAINER_NAME:-wordpress_apache}
    logging: *default_logging
    depends_on:
      wordpress_fpm:
        condition: service_healthy
    ports:
      - "${WP_HTTP_PORT:-80}:80"
      - "${WP_HTTPS_PORT:-443}:443"
    volumes:
      - ${WP_APACHE_CONF_PATH:-./apache/httpd.conf}:/usr/local/apache2/conf/httpd.conf:ro
      - ./apache/cloudflare-allowlist.conf:/usr/local/apache2/conf/cloudflare-allowlist.conf:ro
      - ${WP_APACHE_EXTRA_PATH:-./apache/extra}:/usr/local/apache2/conf/extra:ro
      - ${WP_APACHE_SNIPPETS_PATH:-./apache/snippets}:/usr/local/apache2/conf/snippets:ro
      - ${WP_APACHE_VHOSTS_PATH:-./apache/vhosts}:/usr/local/apache2/conf/vhosts:ro
      - ${WP_HTML_PATH:-./html}:/var/www/html:delegated
      - ${WP_LETSENCRYPT_PATH:-/etc/letsencrypt}:/etc/letsencrypt:ro
      - ${WP_API_ROOT_PATH:-./api-root}:/var/www/api-root:ro
      - ${WP_SEARCH_ROOT_PATH:-./search-root}:/var/www/search-root:ro
      - /var/www/update.ailinux.me:/var/www/update.ailinux.me:ro
      - ./login.ailinux.me:/var/www/login.ailinux.me:ro
    environment:
      TZ: ${TZ:-Europe/Berlin}
      HTTPS: "on"
    healthcheck:
      test: ["CMD", "httpd", "-t"]
      interval: ${WP_APACHE_HEALTHCHECK_INTERVAL:-30s}
      timeout: ${WP_APACHE_HEALTHCHECK_TIMEOUT:-10s}
      retries: ${WP_APACHE_HEALTHCHECK_RETRIES:-3}
    extra_hosts: *gateway_hosts
    restart: ${WP_RESTART_POLICY:-unless-stopped}
    networks:
      wordpress-network:
        ipv4_address: ${WP_APACHE_STATIC_IP:-172.18.0.10}

  wordpress_fpm:
    image: ${WP_FPM_IMAGE:-wordpress:7.1-php8.3-fpm-alpine}
    container_name: ${WP_FPM_CONTAINER_NAME:-wordpress_fpm}
    logging: *default_logging
    depends_on:
      wordpress_db:
        condition: service_healthy
      wordpress_redis:
        condition: service_healthy
    extra_hosts: *gateway_hosts
    environment:
      TZ: ${TZ:-Europe/Berlin}
      WORDPRESS_DB_HOST: ${WORDPRESS_DB_HOST:-wordpress_db}
      WORDPRESS_DB_NAME: ${WORDPRESS_DB_NAME:-wordpress}
      WORDPRESS_DB_USER: ${WORDPRESS_DB_USER:-wordpress}
      WORDPRESS_DB_PASSWORD: ${WORDPRESS_DB_PASSWORD}
      REDIS_PASSWORD: ${WP_REDIS_PASSWORD:-}
      WORDPRESS_REDIS_HOST: ${WP_REDIS_HOST:-wordpress_redis}
      WORDPRESS_REDIS_PORT: ${WP_REDIS_PORT:-6379}
      # Nova/COPA/LemonSqueezy bridge; values come from docker/wordpress/.env
      LEMONSQUEEZY_WEBHOOK_SECRET: ${LEMONSQUEEZY_WEBHOOK_SECRET:-}
      NOVA_LS_WEBHOOK_SECRET: ${NOVA_LS_WEBHOOK_SECRET:-}
      NOVA_PAYMENT_PROVIDER: ${NOVA_PAYMENT_PROVIDER:-lemonsqueezy}
      NOVA_LS_API_KEY: ${NOVA_LS_API_KEY:-}
      NOVA_LS_STORE_ID: ${NOVA_LS_STORE_ID:-}
      NOVA_LS_VARIANT_ID: ${NOVA_LS_VARIANT_ID:-}
      NOVA_LS_TEST_MODE: ${NOVA_LS_TEST_MODE:-true}
      NOVA_LS_ALLOW_TEST_CHECKOUT: ${NOVA_LS_ALLOW_TEST_CHECKOUT:-false}
      NOVA_LS_WEBHOOK_DIRECT: ${NOVA_LS_WEBHOOK_DIRECT:-true}
      LEMONSQUEEZY_PRODUCT_ENTITLEMENTS: ${LEMONSQUEEZY_PRODUCT_ENTITLEMENTS:-}
      NOVA_LS_PRODUCT_ENTITLEMENTS: ${NOVA_LS_PRODUCT_ENTITLEMENTS:-}
      NOVA_AI_INTERNAL_KEY: ${NOVA_AI_INTERNAL_KEY:-}
      TRIFORCE_API_BASE: ${TRIFORCE_API_BASE:-https://api.ailinux.me}
      # WICHTIG: Kein WORDPRESS_CONFIG_EXTRA mehr -> kein eval-Parse-Error
    volumes:
      - ${WP_HTML_PATH:-./html}:/var/www/html:delegated
      - ${WP_PHP_CUSTOM_INI:-./php/custom.ini}:/usr/local/etc/php/conf.d/99-custom.ini:ro
      # WP-CLI dauerhaft verfuegbar (read-only, ausserhalb Webroot) - 2026-07-11
      - ./bin/wp-cli.phar:/usr/local/bin/wp-cli.phar:ro
      - ./bin/wp:/usr/local/bin/wp:ro
      - ./ensure-redis-config.php:/usr/local/share/ailinux/ensure-redis-config.php:ro
      - ./php/opcache-boost.ini:/usr/local/etc/php/conf.d/zz-ailinux-opcache.ini:ro
      - ${WP_PHP_WWW_CONF:-./php/www.conf}:/usr/local/etc/php-fpm.d/www.conf
    healthcheck:
      test: ["CMD-SHELL", "php-fpm --test 2>&1 | grep -q test"]
      interval: ${WP_FPM_HEALTHCHECK_INTERVAL:-30s}
      timeout: ${WP_FPM_HEALTHCHECK_TIMEOUT:-10s}
      retries: ${WP_FPM_HEALTHCHECK_RETRIES:-3}
      start_period: ${WP_FPM_HEALTHCHECK_START:-15s}
    networks:
      - ${WP_NETWORK:-wordpress-network}
    restart: ${WP_RESTART_POLICY:-unless-stopped}

  wordpress_db:
    image: ${WP_DB_IMAGE:-mariadb:11.8}
    container_name: ${WP_DB_CONTAINER_NAME:-wordpress_db}
    environment:
      TZ: ${TZ:-Europe/Berlin}
      MYSQL_DATABASE: ${WORDPRESS_DB_NAME:-wordpress}
      MYSQL_USER: ${WORDPRESS_DB_USER:-wordpress}
      MYSQL_PASSWORD: ${WORDPRESS_DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    volumes:
      - ${WP_DB_DATA_VOLUME:-wp_db_data}:/var/lib/mysql
      - ${WP_DB_CUSTOM_CNF:-./mysql/custom.cnf}:/etc/mysql/conf.d/custom.cnf:ro
      - ./mysql/conf.d:/etc/mysql/conf.d/extra:ro
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=\"${MYSQL_ROOT_PASSWORD}\" mariadb-admin ping -h 127.0.0.1 -uroot --silent"]
      interval: ${WP_DB_HEALTHCHECK_INTERVAL:-10s}
      timeout: ${WP_DB_HEALTHCHECK_TIMEOUT:-5s}
      retries: ${WP_DB_HEALTHCHECK_RETRIES:-12}
      start_period: ${WP_DB_HEALTHCHECK_START:-30s}
    networks:
      - ${WP_NETWORK:-wordpress-network}
    restart: ${WP_RESTART_POLICY:-unless-stopped}
    logging: *default_logging

  wordpress_redis:
    image: ${WP_REDIS_IMAGE:-redis:8.10-alpine}
    container_name: ${WP_REDIS_CONTAINER_NAME:-wordpress_redis}
    environment:
      REDIS_PASSWORD: ${WP_REDIS_PASSWORD:-}
    command: >
      sh -c "
        if [ -n \"$$REDIS_PASSWORD\" ]; then
          exec redis-server /etc/redis/redis.conf --requirepass \"$$REDIS_PASSWORD\"
        else
          exec redis-server /etc/redis/redis.conf
        fi
      "
    healthcheck:
      test: ["CMD-SHELL", "if [ -n \"$$REDIS_PASSWORD\" ]; then redis-cli -a \"$$REDIS_PASSWORD\" ping | grep -q PONG; else redis-cli ping | grep -q PONG; fi"]
      interval: ${WP_REDIS_HEALTHCHECK_INTERVAL:-30s}
      timeout: ${WP_REDIS_HEALTHCHECK_TIMEOUT:-10s}
      retries: ${WP_REDIS_HEALTHCHECK_RETRIES:-5}
    volumes:
      - ./redis/redis-optimized.conf:/etc/redis/redis.conf:ro
      - ${WP_REDIS_DATA_VOLUME:-wp_redis_data}:/data
    networks:
      - ${WP_NETWORK:-wordpress-network}
    restart: ${WP_RESTART_POLICY:-unless-stopped}
    logging: *default_logging

  wpcli:
    image: ${WP_CLI_IMAGE:-wordpress:cli}
    container_name: ${WP_CLI_CONTAINER_NAME:-wordpress_wpcli}
    profiles: ["tools"]
    depends_on:
      wordpress_fpm:
        condition: service_healthy
      wordpress_db:
        condition: service_healthy
    working_dir: /var/www/html
    user: "${WP_CLI_USER:-82:82}"
    environment:
      TZ: ${TZ:-Europe/Berlin}
      WORDPRESS_DB_HOST: ${WORDPRESS_DB_HOST:-wordpress_db}
      WORDPRESS_DB_NAME: ${WORDPRESS_DB_NAME:-wordpress}
      WORDPRESS_DB_USER: ${WORDPRESS_DB_USER:-wordpress}
      WORDPRESS_DB_PASSWORD: ${WORDPRESS_DB_PASSWORD}
    volumes:
      - ${WP_HTML_PATH:-./html}:/var/www/html:delegated
    extra_hosts: *gateway_hosts
    entrypoint: ["wp", "--allow-root"]
    networks:
      - ${WP_NETWORK:-wordpress-network}

networks:
  wordpress-network:
    name: ${WP_NETWORK:-wordpress-network}
    driver: ${WP_NETWORK_DRIVER:-bridge}
    external: false

volumes:
  wp_db_data:
    name: ${WP_DB_DATA_VOLUME:-wp_db_data}
  wp_redis_data:
    name: ${WP_REDIS_DATA_VOLUME:-wp_redis_data}
