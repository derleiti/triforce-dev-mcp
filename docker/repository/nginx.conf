
user  nginx;
worker_processes  auto;

events {
  worker_connections 4096;
  multi_accept on;
}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;

  # CORS nur ailinux.me (inkl. Subdomains, mit/ohne Port)
  map $http_origin $cors_api_origin {
    default "";
    "" "";
    ~^https?://([a-z0-9-]+\.)?ailinux\.me(:[0-9]+)?$ $http_origin;
  }
  map "$http_origin|$cors_api_origin" $cors_api_reject {
    default 0;
    ~^.+\|$ 1;
  }

  sendfile on;
  tcp_nopush on;
  tcp_nodelay on;
  keepalive_timeout 30;
  keepalive_requests 1000;

  # APT repository is almost entirely static files; cache metadata, not content.
  open_file_cache max=10000 inactive=60s;
  open_file_cache_valid 120s;
  open_file_cache_min_uses 2;
  open_file_cache_errors on;

  gzip on;
  gzip_vary on;
  gzip_proxied any;
  gzip_comp_level 6;
  gzip_buffers 16 8k;
  gzip_http_version 1.1;
  gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

  server_tokens off;

  access_log /var/log/nginx/access.log;
  error_log  /var/log/nginx/error.log warn;

  include /etc/nginx/conf.d/*.conf;
}


