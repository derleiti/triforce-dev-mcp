# AILinux Repository Server Config
# repo.ailinux.me - Fixed 2026-01-02

server {
    listen 8080;
    server_name repo.ailinux.me localhost;

    root /repo;
    autoindex on;
    autoindex_exact_size off;
    autoindex_localtime on;
    autoindex_format html;

    index index.html;
    charset utf-8;

    # CORS Headers für APT-Clients
    add_header Access-Control-Allow-Origin "*" always;
    add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;
    add_header Access-Control-Allow-Headers "Range, Content-Type" always;

    # Standard Location
    location / {
        try_files $uri $uri/ =404;
    }

    # Mirror-Verzeichnis
    location /mirror/ {
        alias /repo/mirror/;
        autoindex on;
        autoindex_exact_size on;
        autoindex_localtime on;
        # Old package URLs from stale APT caches are normal 404s, not server errors.
        log_not_found off;
    }

    # GPG Key Direktzugriff
    location /ailinux.gpg {
        alias /repo/ailinux-archive-key.gpg;
        default_type application/pgp-keys;
    }

    # Add-Repo Script
    location = /add-ailinux-repo.sh {
        alias /repo/mirror/add-ailinux-repo.sh;
        default_type text/plain;
    }

    # Health Check
    location /health {
        access_log off;
        return 200 "OK\n";
        add_header Content-Type text/plain;
    }

    # GPG Keys
    location ~ \.gpg$ {
        default_type application/pgp-keys;
    }

    # Deb/Package Files
    location ~ \.(deb|ddeb|udeb|dsc|changes)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    # APT index metadata: never CDN-cache these independently of Release files.
    # Otherwise apt can see Release for version N and stale Packages.gz for N-1.
    location ~* /(Packages|Sources|Release|InRelease)(\.(gz|bz2|xz|lz4|zst))?$ {
        # These files are rewritten in-place by update-mirror.sh. Never cache
        # open/stat results (including EACCES/ENOENT), otherwise nginx can keep
        # serving a stale 403 after permissions or files have been corrected.
        open_file_cache off;
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
    }

    # Pre-compressed APT indexes are static files. Do not synthesize a
    # Content-Encoding header here: .gz/.xz describe the file format itself,
    # while HTTP content-encoding is a separate transport concern. Adding an
    # identity header here can conflict with proxy/CDN compression handling.
    location ~* \.(gz|bz2|xz|lz4|zst)$ {
        default_type application/octet-stream;
    }
}
