# Route dynamic SEO endpoints through Flarum instead of the generic static XML rule.
location = /sitemap.xml {
    rewrite ^ /index.php?$query_string last;
    add_header Cache-Control "max-age=0";
}

location ^~ /sitemap- {
    rewrite ^ /index.php?$query_string last;
    add_header Cache-Control "max-age=0";
}

# Production hardening: source maps expose application internals and are not
# required by browsers at runtime. Keep them available in build artifacts only.
location ~* \.map$ {
    return 404;
}
